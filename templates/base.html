<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HWddns{% endblock %} · 华为云 DNS</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% if session.authenticated %}
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}"><span class="brand-icon">↗</span> HWddns <small>华为云解析管理</small></a>
    <nav><a href="{{ url_for('index') }}">任务</a><a href="{{ url_for('settings') }}">云账号设置</a><form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="text-button">退出</button></form></nav>
  </header>
  {% endif %}
  <main class="container {% if not session.authenticated %}login-container{% endif %}">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
