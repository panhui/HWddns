<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HWddns{% endblock %} · DNS 管理</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% if session.authenticated %}
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ url_for('index') }}" aria-label="HWddns 首页"><span class="brand-icon">↗</span><span>HWddns<small>DNS 解析管理</small></span></a>
      <nav aria-label="主导航">
        <a class="{{ 'active' if request.endpoint in ('index', 'new_task', 'new_probe_task', 'edit_task', 'task_logs') else '' }}" href="{{ url_for('index') }}" {{ 'aria-current="page"'|safe if request.endpoint in ('index', 'new_task', 'new_probe_task', 'edit_task', 'task_logs') else '' }}>任务管理</a>
        <a class="{{ 'active' if request.endpoint == 'ip_check' else '' }}" href="{{ url_for('ip_check') }}" {{ 'aria-current="page"'|safe if request.endpoint == 'ip_check' else '' }}>IP 检测</a>
        <a class="{{ 'active' if request.endpoint == 'settings' else '' }}" href="{{ url_for('settings') }}" {{ 'aria-current="page"'|safe if request.endpoint == 'settings' else '' }}>云账号设置</a>
      </nav>
      <form method="post" action="{{ url_for('logout') }}" class="logout-form"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="text-button">退出</button></form>
    </div>
  </header>
  {% endif %}
  <main class="container {% if not session.authenticated %}login-container{% endif %}">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="alert {{ category }}" role="status">{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
