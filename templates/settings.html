{% extends 'base.html' %}
{% block title %}云账号设置{% endblock %}
{% block content %}
<div class="heading"><div><div class="eyebrow">CREDENTIALS</div><h1>云账号设置</h1><p class="muted">凭据加密保存在服务器本地，不会显示在页面中。</p></div></div>
<div class="card form-card"><form method="post" class="stack"><input type="hidden" name="csrf" value="{{ csrf }}"><div class="form-title"><h2>华为云访问凭据</h2><span class="pill {{ 'success' if configured else 'pending' }}">{{ '已配置' if configured else '未配置' }}</span></div>
<label>Access Key ID<input name="ak" type="text" autocomplete="off" placeholder="{{ '留空则保持现有凭据' if configured else '输入 Access Key ID' }}"></label>
<label>Secret Access Key<input name="sk" type="password" autocomplete="new-password" placeholder="{{ '留空则保持现有凭据' if configured else '输入 Secret Access Key' }}"></label>
<label>DNS 区域<input name="region" type="text" value="{{ region }}" required><span class="hint">一般使用 cn-north-4。请与您的华为云 DNS 服务区域保持一致。</span></label>
<button class="button primary" type="submit">保存设置</button></form></div>
{% endblock %}
