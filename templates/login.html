{% extends 'base.html' %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="login-card card">
  <div class="mark">↗</div>
  <h1>欢迎使用 HWddns</h1>
  <p class="muted">登录后管理华为云 DNS 定时任务</p>
  <form method="post" class="stack">
    <label>管理员密码<input type="password" name="password" required autofocus autocomplete="current-password" placeholder="请输入管理员密码"></label>
    <button class="button primary full">登录面板</button>
  </form>
</div>
{% endblock %}
