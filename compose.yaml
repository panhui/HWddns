services:
  hwddns:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-6006}:6006"
    volumes:
      - hwddns_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  hwddns_data:
