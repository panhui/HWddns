name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Bundle desktop app
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name HWddns --collect-all tzdata
          --hidden-import six --hidden-import six.moves.urllib.parse
          --add-data "templates:templates" --add-data "static:static"
          windows_launcher.py
      - name: Check bundled app
        shell: pwsh
        run: |
          & .\dist\HWddns\HWddns.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile installer
        shell: pwsh
        working-directory: windows
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check installed app
        shell: pwsh
        run: |
          $setup = Resolve-Path .\windows\Output\HWddns-Windows-Setup.exe
          $process = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\HWddns\HWddns.exe'
          if (!(Test-Path $installed)) { throw "Installed app not found: $installed" }
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          Remove-Item Env:PYTHONHOME -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:LOCALAPPDATA 'HWddns') -Recurse -Force -ErrorAction SilentlyContinue
          & $installed --self-test
          if ($LASTEXITCODE -ne 0) {
            $errorFile = Join-Path $env:TEMP 'hwddns-self-test-error.txt'
            if (Test-Path $errorFile) { Get-Content $errorFile }
            exit $LASTEXITCODE
          }
      - uses: actions/upload-artifact@v7
        with:
          name: HWddns-Windows-Setup
          path: windows/Output/HWddns-Windows-Setup.exe
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "windows/Output/HWddns-Windows-Setup.exe"
          --title "HWddns ${{ github.ref_name }}"
          --generate-notes
